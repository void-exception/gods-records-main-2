<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <style>
        :root {
            --bg-dark: #1b3322;
            --panel-bg: #23442d;
            --input-bg: #d2d2d2;
            --text-color: #ffffff;
            --text-muted: #a0b0a0;
            --btn-bg: #24352a;
            --btn-hover: #2f4537;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* корректная высота на мобильных с адресной строкой */
        }

        .login-container {
            background-color: var(--panel-bg);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .login-container h1 {
            margin: 0 0 25px 0;
            font-size: clamp(28px, 8vw, 36px);
            font-weight: normal;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--input-bg);
            color: #111111;
            font-size: 16px; /* 16px предотвращает авто-зум в iOS Safari */
            -webkit-appearance: none;
            appearance: none;
        }

        .input-field::placeholder {
            color: #555555;
        }

        .input-field:focus {
            outline: 2px solid #5a8a68;
        }

        .forgot-btn {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            text-align: left;
            margin: -6px 0 24px 4px;
        }

        .forgot-btn:hover {
            color: var(--text-color);
        }

        .submit-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 12px 36px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%; /* на мобильных удобнее на всю ширину */
            max-width: 220px;
            min-height: 44px; /* минимальный размер тач-цели */
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn:hover,
        .submit-btn:active {
            background-color: var(--btn-hover);
        }

        .message {
            width: 100%;
            max-width: 340px;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background-color: #5c2626;
            color: #ffcdd2;
            border: 1px solid #d32f2f;
        }

        .success {
            background-color: #1c4427;
            color: #c8e6c9;
            border: 1px solid #388e3c;
        }

        .link-register {
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .link-register a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
        }

        .link-register a:hover {
            text-decoration: underline;
        }

        /* --- Планшеты и небольшие экраны --- */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            .login-container {
                padding: 30px 22px;
                border-radius: 20px;
            }
            .login-container h1 {
                margin-bottom: 20px;
            }
            .submit-btn {
                max-width: 100%;
            }
        }

        /* --- Очень узкие экраны / компактные телефоны --- */
        @media (max-width: 360px) {
            .login-container {
                padding: 24px 16px;
                border-radius: 16px;
            }
            .input-field {
                padding: 11px 14px;
            }
        }

        /* --- Низкие экраны (ландшафт телефона) --- */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                justify-content: flex-start;
                padding-top: 20px;
                padding-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Всплывающие уведомления состояния Thymeleaf над формой -->
<div class="message error" th:if="${param.error}">
    Неверный email или пароль
</div>

<div class="message success" th:if="${param.logout}">
    Вы успешно вышли из системы
</div>

<div class="login-container">
    <h1>Вход</h1>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <input type="email" id="username" name="username" class="input-field" placeholder="Эл.почта..." required autofocus />
        </div>

        <div class="input-group">
            <input type="password" id="password" name="password" class="input-field" placeholder="Пароль..." required />
        </div>

        <button type="submit" class="submit-btn">Войти</button>
    </form>

    <div class="link-register">
        Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
    </div>
</div>

</body>
</html>
