<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметка</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        :root {
            --bg-dark: #1b3322;
            --panel-bg: #23442d;
            --card-bg: #2a5c3a;
            --input-bg: #cccccc;
            --text-color: #ffffff;
            --text-muted: #a0b0a0;
            --btn-submit: #2a3d30;
            --btn-hover: #344d3c;
            --btn-cancel: #4a2a2a;
            --btn-cancel-hover: #5e3535;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topbar a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 4px 0;
        }

        .topbar a:hover {
            color: var(--text-color);
        }

        h1 {
            margin: 10px 0;
            font-size: clamp(22px, 6vw, 28px);
            font-weight: normal;
            line-height: 1.25;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .meta {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
            word-break: break-word;
        }

        .meta span {
            white-space: nowrap; /* дата не рвётся посередине */
        }

        .body {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 25px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            font-size: 16px;
            overflow-wrap: anywhere;   /* длинные слова/ссылки не рвут карточку */
            word-break: break-word;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 25px 0;
        }

        h3 {
            font-weight: normal;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type=text], textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background-color: var(--input-bg);
            color: #111111;
            font-size: 16px; /* 16px — iOS не зумит при фокусе */
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* ====== Кнопки действий ====== */
        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions button {
            background-color: var(--btn-submit);
            color: var(--text-color);
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
        }

        .actions button:hover,
        .actions button:active {
            background-color: var(--btn-hover);
        }

        .actions button.cancel {
            background-color: var(--btn-cancel);
        }

        .actions button.cancel:hover,
        .actions button.cancel:active {
            background-color: var(--btn-cancel-hover);
        }

        .edit-open-btn {
            background-color: var(--btn-submit);
            color: var(--text-color);
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
        }

        .edit-open-btn:hover,
        .edit-open-btn:active {
            background-color: var(--btn-hover);
        }

        .hidden { display: none !important; }

        #error { color: #ff6b6b; margin-top: 12px; font-size: 14px; }
        #success { color: #69db7c; margin-top: 12px; font-size: 14px; }

        /* ================================================
           Адаптив
           ================================================ */

        /* --- ≤ 600px: планшеты/телефоны --- */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .app-container {
                padding: 20px;
                border-radius: 16px;
            }

            .body {
                padding: 16px;
                border-radius: 12px;
                font-size: 15.5px;
            }

            /* Кнопки растягиваем на всю ширину и делим пополам */
            .actions button {
                flex: 1 1 0;
                padding: 12px 16px;
                min-width: 0;
            }

            .edit-open-btn {
                display: block;
                width: 100%;
                padding: 14px 20px;
                font-size: 16px;
            }

            h3 {
                font-size: 18px;
            }
        }

        /* --- ≤ 400px: очень узкие экраны --- */
        @media (max-width: 400px) {
            body { padding: 12px 8px; }
            .app-container {
                padding: 16px;
                border-radius: 12px;
            }
            .body { padding: 14px; }
            .actions { gap: 8px; }
            .actions button {
                padding: 12px 10px;
                font-size: 15px;
            }
            textarea { min-height: 100px; }
        }

        /* --- Ландшафт низких телефонов --- */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 12px;
                align-items: stretch;
            }
            .app-container {
                padding: 16px;
                max-width: 100%;
            }
            .body {
                padding: 14px;
                margin-bottom: 16px;
            }
            textarea { min-height: 80px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="topbar">
        <div><a th:href="@{/home}">← К списку</a></div>
    </div>

    <!-- ====== Режим чтения ====== -->
    <div id="readView">
        <h1 id="title">Загрузка…</h1>

        <div class="body" id="body"></div>

        <div class="meta">
            Создано: <span id="createdAt">?</span> ·
            Изменено: <span id="updatedAt">?</span>
        </div>

        <button type="button" class="edit-open-btn" onclick="openEdit()">Редактировать</button>
    </div>

    <!-- ====== Режим редактирования ====== -->
    <div id="editView" class="hidden">
        <h3>Редактировать</h3>

        <form id="editForm">
            <label for="name">Заголовок</label>
            <input type="text" id="name" required />

            <label for="bodyInput">Текст</label>
            <textarea id="bodyInput"></textarea>

            <div class="actions">
                <button type="submit">Сохранить</button>
                <button type="button" class="cancel" onclick="closeEdit()">Отмена</button>
            </div>

            <div id="error"></div>
            <div id="success"></div>
        </form>
    </div>
</div>

<script>
    const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    const pathParts = window.location.pathname.split('/');
    const taskId = pathParts[pathParts.length - 1];

    const errorBox   = document.getElementById('error');
    const successBox = document.getElementById('success');

    // Тип карточки, полученный с сервера. Менять его на этой странице нельзя,
    // но при сохранении он должен уйти обратно без изменений — бэкенд его ждёт.
    let currentType = null;

    // ====== Переключение режимов ======
    function openEdit() {
        document.getElementById('editView').classList.remove('hidden');
        document.getElementById('readView').classList.add('hidden');
        errorBox.textContent = '';
        successBox.textContent = '';
        document.getElementById('name').focus();
    }

    function closeEdit() {
        document.getElementById('editView').classList.add('hidden');
        document.getElementById('readView').classList.remove('hidden');
        errorBox.textContent = '';
        successBox.textContent = '';
    }

    // ====== Загрузка через REST ======
    async function loadTask() {
        const res = await fetch('/api/task/' + taskId);

        if (res.status === 404) {
            document.getElementById('title').textContent = 'Заметка не найдена';
            document.getElementById('readView').querySelector('.edit-open-btn').style.display = 'none';
            document.getElementById('body').style.display = 'none';
            document.getElementById('editView').classList.add('hidden');
            return;
        }
        if (!res.ok) {
            errorBox.textContent = 'Ошибка загрузки: ' + res.status;
            return;
        }

        const t = await res.json();

        // Запоминаем текущий тип — он уйдёт обратно при сохранении
        currentType = t.type;

        document.getElementById('title').textContent = t.name;
        document.getElementById('createdAt').textContent = new Date(t.createdAt).toLocaleString('ru-RU');
        document.getElementById('updatedAt').textContent = new Date(t.updatedAt).toLocaleString('ru-RU');
        document.getElementById('body').textContent = t.body ?? '';

        document.getElementById('name').value = t.name;
        document.getElementById('bodyInput').value = t.body ?? '';
    }

    // ============================================================
    // Сохранение: теперь JSON в теле запроса (@RequestBody)
    // ============================================================
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.textContent = '';
        successBox.textContent = '';

        if (!currentType) {
            errorBox.textContent = 'Тип заметки ещё не загружен, попробуйте позже';
            return;
        }

        // Тип отправляем тем же, что и пришёл с сервера — пользователь его не меняет
        const res = await fetch('/api/update/' + taskId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                body: document.getElementById('bodyInput').value,
                type: currentType
            })
        });

        if (res.ok) {
            await loadTask();   // обновляем данные в режиме чтения
            closeEdit();        // возвращаемся в режим чтения
        } else {
            errorBox.textContent = 'Не удалось сохранить: ' + res.status;
        }
    });

    loadTask();
</script>

</body>
</html>
